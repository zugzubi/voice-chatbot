services:
  - type: web
    name: voice-chatbot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python train.py
    startCommand: gunicorn app:app --workers 1 --threads 1 --timeout 300 --graceful-timeout 60 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
